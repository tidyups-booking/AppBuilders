name: Local EAS Builds (Backup)

on:
  push:
    branches: [main, master]
    paths:
      - "artifacts/mobile/**"
      - ".github/workflows/react-native-cicd.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "artifacts/mobile/**"
      - ".github/workflows/react-native-cicd.yml"
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platform to build
        required: true
        default: android
        options:
          - android
          - ios
          - all
      buildType:
        type: choice
        description: Artifact type to build
        required: true
        default: android-apk
        options:
          - development
          - android-apk
          - android-aab
          - ios-production
          - all

permissions:
  contents: read

concurrency:
  group: local-eas-${{ github.ref }}-${{ github.event.inputs.platform }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  validate-request:
    name: Validate build selection
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Validate inputs and select runners
        id: selection
        shell: bash
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
          BUILD_TYPE: ${{ github.event.inputs.buildType || 'android-apk' }}
        run: |
          case "$PLATFORM:$BUILD_TYPE" in
            android:development|android:android-apk|android:android-aab|android:all)
              ;;
            ios:development|ios:ios-production|ios:all)
              ;;
            all:development|all:all)
              ;;
            *)
              echo "::error::$BUILD_TYPE is not valid for platform $PLATFORM."
              exit 1
              ;;
          esac

          case "$PLATFORM" in
            android)
              matrix='{"include":[{"platform":"android","runner":"ubuntu-latest"}]}'
              ;;
            ios)
              matrix='{"include":[{"platform":"ios","runner":"macos-latest"}]}'
              ;;
            all)
              matrix='{"include":[{"platform":"android","runner":"ubuntu-latest"},{"platform":"ios","runner":"macos-latest"}]}'
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} locally
    needs: validate-request
    strategy:
      matrix: ${{ fromJSON(needs.validate-request.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: artifacts/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up JDK 17
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Require Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is required to access Expo-managed signing credentials."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare artifact directory
        run: mkdir -p build

      - name: Build development APK
        if: ${{ matrix.platform == 'android' && (github.event.inputs.buildType == 'development' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform android --profile development --local --non-interactive --output ./build/tidyups-dev.apk

      - name: Build production APK
        if: ${{ matrix.platform == 'android' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event.inputs.buildType == 'android-apk' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform android --profile production-apk --local --non-interactive --output ./build/tidyups-prod.apk

      - name: Build production AAB
        if: ${{ matrix.platform == 'android' && (github.event.inputs.buildType == 'android-aab' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform android --profile production --local --non-interactive --output ./build/tidyups-prod.aab

      - name: Build iOS production IPA
        if: ${{ matrix.platform == 'ios' && (github.event.inputs.buildType == 'ios-production' || github.event.inputs.buildType == 'all') }}
        run: eas build --platform ios --profile production --local --non-interactive --output ./build/tidyups-prod.ipa

      - name: Upload builds to Google Drive (optional backup)
        continue-on-error: true
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: ${{ secrets.RCLONE_CONFIG_GDRIVE_TYPE }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID }}
        run: |
          if [ -z "$RCLONE_CONFIG_GDRIVE_TOKEN" ]; then
            echo "Google Drive secrets not configured; skipping Drive backup."
            exit 0
          fi

          sudo apt-get update -y && sudo apt-get install -y rclone || curl https://rclone.org/install.sh | sudo bash

          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = ${RCLONE_CONFIG_GDRIVE_TYPE}
          token = ${RCLONE_CONFIG_GDRIVE_TOKEN}
          root_folder_id = ${RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID}
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

          VERSION=$(node -p "require('./app.json').expo.version")
          FOLDER="833 Tidyups Builds/${VERSION}-${{ github.event.inputs.buildType || 'development' }}-${{ github.run_id }}-${{ matrix.platform }}"

          rclone mkdir "gdrive:${FOLDER}"
          rclone copy ./build "gdrive:${FOLDER}" \
            --include "*.apk" --include "*.aab" --include "*.ipa" -v
          echo "Uploaded to Google Drive: ${FOLDER}"

      - name: Upload build artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidyups-${{ matrix.platform }}-${{ github.event.inputs.buildType || 'development' }}-${{ github.run_id }}
          path: |
            artifacts/mobile/build/*.apk
            artifacts/mobile/build/*.aab
            artifacts/mobile/build/*.ipa
          if-no-files-found: warn
          retention-days: 7
